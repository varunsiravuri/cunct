[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-autopsy"
version = "0.1.0"
description = "HydraDB Churn Autopsy — cross-source retrieval with FastLane planner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "hydradb-sdk>=2,<3",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "rich>=13.0.0",
  "typer>=0.12.0",
  "orjson>=3.10.0",
  "tenacity>=8.0.0",
]

[project.scripts]
churn-autopsy = "churn_autopsy.demo.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["churn_autopsy*"]